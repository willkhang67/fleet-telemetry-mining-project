[project]
name = "simulator"
version = "0.1.0"
description = "Synthetic mining-fleet telemetry publisher for local Kafka (not real mine data)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.0",
]

[project.scripts]
simulator = "simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
